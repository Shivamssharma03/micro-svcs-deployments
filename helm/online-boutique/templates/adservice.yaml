apiVersion: apps/v1
kind: Deployment
metadata:
  name: adservice
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.adservice.replicaCount }}
  selector:
    matchLabels:
      app: adservice
  template:
    metadata:
      labels:
        app: adservice
    spec:
      containers:
        - name: adservice
          image: {{ .Values.adservice.image }}
          ports:
            - containerPort: {{ .Values.adservice.service.targetPort }}

          env: 
            - name: PRODUCT_CATALOG_SERVICE_ADDR 
              value: "{{ .Values.adservice.env.PRODUCT_CATALOG_SERVICE_ADDR}}"
          resources:
            requests:
              cpu: {{ .Values.adservice.resources.requests.cpu }}
              memory: {{ .Values.adservice.resources.requests.memory }}
            limits:
              cpu: {{ .Values.adservice.resources.limits.cpu }}
              memory: {{ .Values.adservice.resources.limits.memory }}

---
apiVersion: v1
kind: Service
metadata:
  name: adservice
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: adservice
  ports:
    - port: {{ .Values.adservice.service.port }}
      targetPort: {{ .Values.adservice.service.targetPort }}
