apiVersion: apps/v1
kind: Deployment
metadata:
  name: currencyservice
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.currencyservice.replicaCount }}
  selector:
    matchLabels:
      app: currencyservice
  template:
    metadata:
      labels:
        app: currencyservice
    spec:
      containers:
        - name: currencyservice
          image: {{ .Values.currencyservice.image }}
          ports:
            - containerPort: {{ .Values.currencyservice.service.targetPort }}
          env:
          - name: DISABLE_PROFILER
            value: "{{ .Values.currencyservice.env.DISABLE_PROFILER }}"
          - name: PORT
            value: "{{ .Values.currencyservice.env.PORT }}"
          resources:
            requests:
              cpu: {{ .Values.currencyservice.resources.requests.cpu }}
              memory: {{ .Values.currencyservice.resources.requests.memory }}
            limits:
              cpu: {{ .Values.currencyservice.resources.limits.cpu }}
              memory: {{ .Values.currencyservice.resources.limits.memory }}

---
apiVersion: v1
kind: Service
metadata:
  name: currencyservice
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: currencyservice
  ports:
    - port: {{ .Values.currencyservice.service.port }}
      targetPort: {{ .Values.currencyservice.service.targetPort }}
