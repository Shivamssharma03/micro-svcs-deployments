apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgenerator
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.loadgenerator.replicaCount }}
  selector:
    matchLabels:
      app: loadgenerator
  template:
    metadata:
      labels:
        app: loadgenerator
    spec:
      containers:
        - name: loadgenerator
          image: {{ .Values.loadgenerator.image }}
          ports:
            - containerPort: {{ .Values.loadgenerator.service.targetPort }}
          env: 
              - name: FRONTEND_ADDR
                value: "{{ .Values.loadgenerator.env.FRONTEND_ADDR }}"
          resources:
            requests:
              cpu: {{ .Values.loadgenerator.resources.requests.cpu }}
              memory: {{ .Values.loadgenerator.resources.requests.memory }}
            limits:
              cpu: {{ .Values.loadgenerator.resources.limits.cpu }}
              memory: {{ .Values.loadgenerator.resources.limits.memory }}

